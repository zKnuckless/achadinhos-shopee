name: Verify Achadinhos build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun from npm
        run: npm install --global bun@1.4.4
      - name: Confirm Bun version
        run: bun --version
      - name: Refresh Bun lockfile
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Refresh Bun lockfile after security update"
            git push
          fi
      - name: Build for Vercel
        run: bun run build
      - name: Run project tests
        run: bun run test
